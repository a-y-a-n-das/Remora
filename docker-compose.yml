services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remora-backend
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "127.0.0.1:8010:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8010
    container_name: remora-frontend
    ports:
      - "127.0.0.1:8011:80"
    restart: unless-stopped